<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="MHW v0.2 云端模拟反馈演示。仅使用合成数据回放，不连接采集设备。"><title>MHW 云端模拟反馈</title><link rel="stylesheet" href="./style.css?v=participant-clean-1"></head><body><main>
<header><span>MHW 跑步反馈</span></header>
<section class="controls" aria-label="模拟回放控制"><label>症状侧（患侧）<select id="symptomatic-side"><option value="left">LEFT · 左脚</option><option value="right" selected>RIGHT · 右脚</option></select></label><div class="buttons"><button id="play" type="button">暂停</button><button id="restart" type="button">重新开始</button></div></section>
<div id="message" role="status" aria-live="polite">正在载入模拟记录…</div>
<section id="feedback-panel" hidden aria-label="内侧幅度差反馈"><div class="foot-heading"><strong>MHW大小示意</strong><span>本人视角：你的左脚在左，右脚在右</span></div><div id="feet" class="feet"><div id="foot-left" class="foot"><div class="foot-art"><svg viewBox="0 0 120 200" aria-hidden="true"><g class="foot-shape"><path d="M57 67 C28 58 17 88 25 112 C31 130 39 135 38 157 C36 183 49 193 65 191 C84 188 85 169 78 148 C70 123 90 104 90 84 C90 69 76 63 57 67Z"/><ellipse cx="88" cy="42" rx="15" ry="24"/><ellipse cx="61" cy="35" rx="11" ry="19"/><ellipse cx="40" cy="44" rx="9" ry="16"/><ellipse cx="24" cy="58" rx="8" ry="13"/><ellipse cx="15" cy="76" rx="7" ry="10"/></g></svg></div><strong>左脚 · LEFT</strong><span id="role-left">对侧</span></div><div class="foot-middle">↑ 前方<br><span>仅示意幅度差</span></div><div id="foot-right" class="foot"><div class="foot-art"><svg viewBox="0 0 120 200" aria-hidden="true"><g class="foot-shape"><path d="M57 67 C28 58 17 88 25 112 C31 130 39 135 38 157 C36 183 49 193 65 191 C84 188 85 169 78 148 C70 123 90 104 90 84 C90 69 76 63 57 67Z"/><ellipse cx="88" cy="42" rx="15" ry="24"/><ellipse cx="61" cy="35" rx="11" ry="19"/><ellipse cx="40" cy="44" rx="9" ry="16"/><ellipse cx="24" cy="58" rx="8" ry="13"/><ellipse cx="15" cy="76" rx="7" ry="10"/></g></svg></div><strong>右脚 · RIGHT</strong><span id="role-right">症状侧</span></div></div><p class="caption">MHW差值 · 症状侧 − 对侧</p><div id="value" class="value">—</div><p class="sign-key">正值：症状侧更大 · 负值：对侧更大 · 目标 ±3°</p><div class="scale" aria-hidden="true"><div class="target"><span>目标区</span></div><div class="zero"></div><div id="cursor" class="cursor"></div></div><div class="ticks"><span>−12°</span><span>−3°</span><span>+3°</span><span>+12°</span></div><p id="direction" class="direction"></p></section>
<div class="timeline"><label for="seek">模拟时间 <output id="time">0.0 / 120.0 秒</output></label><input id="seek" type="range" min="0" max="1200" step="1" value="0" aria-label="模拟时间"></div>
<footer><span id="connection">模拟记录载入中</span><button id="fullscreen" type="button">全屏显示</button></footer>
</main><script src="./app.js?v=participant-clean-1"></script></body></html>
