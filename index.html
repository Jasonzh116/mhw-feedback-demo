<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="仅使用合成数据的反馈回放，不连接采集设备。"><title>跑步反馈</title><link rel="stylesheet" href="./style.css?v=emerald-1"></head><body><main>
<header><span class="demo-label">模拟回放</span><div class="header-actions"><details id="settings"><summary>设置</summary><section class="controls" aria-label="模拟回放控制"><label>症状侧<select id="symptomatic-side"><option value="left">左脚 · LEFT</option><option value="right" selected>右脚 · RIGHT</option></select></label><p>差值 E = 症状侧 − 对侧<br>目标区 −3° 至 +3°（含边界）</p><small>合成数据 · 非临床使用</small></section></details><button id="fullscreen" type="button">全屏</button></div></header>
<div class="patient-display"><div id="message" role="status" aria-live="polite">正在载入模拟记录…</div><section id="feedback-panel" hidden aria-label="跑步反馈"><div id="gauge" class="gauge"><svg class="arc" viewBox="60 0 600 350" role="img" aria-label="左脚和右脚位于弧形内，中央绿色为目标区，红色标出偏大一侧">
<path id="sector-left" class="arc-sector left" d="M360,300 L116.00,300.00 A244,244 0 0,1 266.63,74.57 Z"/><path id="target-center" class="center-region" d="M360,300 L266.63,74.57 A244,244 0 0,1 453.37,74.57 Z"/><path id="sector-right" class="arc-sector right" d="M360,300 L453.37,74.57 A244,244 0 0,1 604.00,300.00 Z"/>
<path class="arc-belt" d="M90.00,300.00 A270,270 0 0,1 630.00,300.00"/><path class="target-belt" d="M256.68,50.55 A270,270 0 0,1 463.32,50.55"/>
<g id="foot-left" class="foot"><g transform="translate(232 215)"><g id="orientation-left" transform="rotate(0)"><svg class="foot-art" x="-35" y="-58" width="70" height="116" viewBox="-4.5 4 120 200" aria-hidden="true"><g class="foot-shape"><path d="M57 67 C28 58 17 88 25 112 C31 130 39 135 38 157 C36 183 49 193 65 191 C84 188 85 169 78 148 C70 123 90 104 90 84 C90 69 76 63 57 67Z"/><ellipse cx="88" cy="42" rx="15" ry="24"/><ellipse cx="61" cy="35" rx="11" ry="19"/><ellipse cx="40" cy="44" rx="9" ry="16"/><ellipse cx="24" cy="58" rx="8" ry="13"/><ellipse cx="15" cy="76" rx="7" ry="10"/></g></svg></g></g></g><g id="foot-right" class="foot"><g transform="translate(488 215)"><g id="orientation-right" transform="rotate(0)"><svg class="foot-art" x="-35" y="-58" width="70" height="116" viewBox="4.5 4 120 200" aria-hidden="true"><g class="foot-shape"><path d="M57 67 C28 58 17 88 25 112 C31 130 39 135 38 157 C36 183 49 193 65 191 C84 188 85 169 78 148 C70 123 90 104 90 84 C90 69 76 63 57 67Z"/><ellipse cx="88" cy="42" rx="15" ry="24"/><ellipse cx="61" cy="35" rx="11" ry="19"/><ellipse cx="40" cy="44" rx="9" ry="16"/><ellipse cx="24" cy="58" rx="8" ry="13"/><ellipse cx="15" cy="76" rx="7" ry="10"/></g></svg></g></g></g><text id="sign-left" class="arc-sign" x="90" y="334" text-anchor="middle">−</text><text id="sign-right" class="arc-sign" x="630" y="334" text-anchor="middle">+</text><g id="cursor"><path class="belt-tick" d="M360 18 L360 42"/></g></svg><div id="value" class="value">—</div></div><p id="direction" class="sr-only"></p></section></div>
<footer><div class="playback"><div class="buttons"><button id="play" type="button">暂停</button><button id="restart" type="button">重新开始</button></div><output id="time">0.0 / 120.0 秒</output></div><input id="seek" type="range" min="0" max="1200" step="1" value="0" aria-label="模拟时间"><span id="connection" class="sr-only">模拟记录载入中</span></footer>
</main><script src="./app.js?v=equal-foot-1"></script></body></html>
