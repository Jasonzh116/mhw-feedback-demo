<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="仅使用合成数据的反馈回放，不连接采集设备。"><title>跑步反馈</title><link rel="stylesheet" href="./style.css?v=arc-gauge-1"></head><body><main>
<section class="controls" aria-label="模拟回放控制"><label>症状侧<select id="symptomatic-side"><option value="left">左脚 · LEFT</option><option value="right" selected>右脚 · RIGHT</option></select></label><div class="buttons"><button id="play" type="button">暂停</button><button id="restart" type="button">重新开始</button></div></section>
<div id="message" role="status" aria-live="polite">正在载入模拟记录…</div>
<section id="feedback-panel" hidden aria-label="跑步反馈">
<div id="gauge" class="gauge"><svg class="arc" viewBox="0 0 600 282" role="img" aria-label="左侧偏大在左，右侧偏大在右；中间为目标区"><path id="sector-left" class="arc-sector left" d="M90.00,250.00 A210,210 0 0,1 219.64,55.99"/><path id="sector-target" class="arc-sector target" d="M219.64,55.99 A210,210 0 0,1 380.36,55.99"/><path id="sector-right" class="arc-sector right" d="M380.36,55.99 A210,210 0 0,1 510.00,250.00"/><path class="tick" d="M119.00,250.00 L107.00,250.00"/><path class="tick" d="M132.78,180.73 L121.69,176.14"/><path class="tick" d="M172.01,122.01 L163.53,113.53"/><path class="tick" d="M230.73,82.78 L226.14,71.69"/><path class="tick" d="M300.00,69.00 L300.00,57.00"/><path class="tick" d="M369.27,82.78 L373.86,71.69"/><path class="tick" d="M427.99,122.01 L436.47,113.53"/><path class="tick" d="M467.22,180.73 L478.31,176.14"/><path class="tick" d="M481.00,250.00 L493.00,250.00"/><text x="300" y="18" text-anchor="middle" class="arc-target-label">目标区 ±3°</text><g id="cursor"><path class="needle" d="M294 250 L300 65 L306 250 Z"/><circle class="hub" cx="300" cy="250" r="12"/></g></svg><div class="arc-legend"><span>← 左侧偏大</span><span>右侧偏大 →</span></div><div id="value" class="value">—</div><p class="sign-key">差值：症状侧 − 对侧</p></div>
<div id="feet" class="feet"><div id="foot-left" class="foot"><strong>左脚 <small>LEFT</small></strong><span id="role-left" class="role"></span><div class="foot-art"><svg viewBox="0 0 120 200" aria-hidden="true"><g class="foot-shape"><path d="M57 67 C28 58 17 88 25 112 C31 130 39 135 38 157 C36 183 49 193 65 191 C84 188 85 169 78 148 C70 123 90 104 90 84 C90 69 76 63 57 67Z"/><ellipse cx="88" cy="42" rx="15" ry="24"/><ellipse cx="61" cy="35" rx="11" ry="19"/><ellipse cx="40" cy="44" rx="9" ry="16"/><ellipse cx="24" cy="58" rx="8" ry="13"/><ellipse cx="15" cy="76" rx="7" ry="10"/></g></svg></div><span id="cue-left" class="foot-cue"></span></div><div id="target-center" class="center-region"><span class="target-check" aria-hidden="true">✓</span><strong>保持</strong><span>目标区内</span></div><div id="foot-right" class="foot"><strong>右脚 <small>RIGHT</small></strong><span id="role-right" class="role"></span><div class="foot-art"><svg viewBox="0 0 120 200" aria-hidden="true"><g class="foot-shape"><path d="M57 67 C28 58 17 88 25 112 C31 130 39 135 38 157 C36 183 49 193 65 191 C84 188 85 169 78 148 C70 123 90 104 90 84 C90 69 76 63 57 67Z"/><ellipse cx="88" cy="42" rx="15" ry="24"/><ellipse cx="61" cy="35" rx="11" ry="19"/><ellipse cx="40" cy="44" rx="9" ry="16"/><ellipse cx="24" cy="58" rx="8" ry="13"/><ellipse cx="15" cy="76" rx="7" ry="10"/></g></svg></div><span id="cue-right" class="foot-cue"></span></div></div><p id="direction" class="direction"></p></section>
<div class="timeline"><label for="seek">模拟时间 <output id="time">0.0 / 120.0 秒</output></label><input id="seek" type="range" min="0" max="1200" step="1" value="0" aria-label="模拟时间"></div>
<footer><span id="connection">模拟记录载入中</span><button id="fullscreen" type="button">全屏显示</button></footer>
</main><script src="./app.js?v=arc-gauge-1"></script></body></html>
